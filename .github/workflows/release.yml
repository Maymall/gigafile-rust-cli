name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  scripts:
    name: installer scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check POSIX installer
        run: |
          sh -n install.sh
          shellcheck install.sh
          shellcheck tests/installers/archive_safety.sh
          sh tests/installers/archive_safety.sh
      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($null -ne $errors -and $errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
          }
          ./tests/installers/archive_safety.ps1

  version:
    name: tag version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -er '.packages[] | select(.name == "rgfile") | .version'
          )"
          expected_tag="v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "release tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${package_version}" >&2
            exit 1
          fi

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Run tests
        run: cargo test --locked --all-features

  msrv:
    name: msrv (Rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Check MSRV
        run: cargo check --locked --all-targets --all-features

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Audit dependencies
        run: cargo audit --deny warnings --file Cargo.lock

  build:
    name: build (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            exe: ""
            install_musl: false
            smoke: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            exe: ""
            install_musl: true
            smoke: true
          - target: aarch64-apple-darwin
            os: macos-15
            archive: tar.gz
            exe: ""
            install_musl: false
            smoke: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive: tar.gz
            exe: ""
            install_musl: false
            smoke: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            exe: ".exe"
            install_musl: false
            smoke: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install musl tools
        if: matrix.install_musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build
        shell: bash
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Smoke
        if: matrix.smoke
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/rgfile${{ matrix.exe }}"
          "$bin" --version

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          target="${{ matrix.target }}"
          name="rgfile-${version}-${target}"
          mkdir -p "dist/${name}"
          cp "target/${target}/release/rgfile${{ matrix.exe }}" "dist/${name}/"
          cp LICENSE README.md "dist/${name}/"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd dist && 7z a "${name}.zip" "${name}" >/dev/null)
          else
            (cd dist && tar -czf "${name}.tar.gz" "${name}")
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  deb:
    name: deb (x86_64, musl)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install cargo-deb
        run: cargo install cargo-deb --version 3.7.0 --locked

      - name: Build deb
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cargo deb --locked --target x86_64-unknown-linux-musl --deb-version "${version}"
          mkdir -p dist
          cp "target/x86_64-unknown-linux-musl/debian/rgfile_${version}_amd64.deb" dist/

      - name: Smoke install
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg -i dist/*.deb
          rgfile --version
          dpkg -L rgfile

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-deb
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: release
    needs: [scripts, version, fmt, clippy, test, msrv, audit, build, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: artifacts
          merge-multiple: true

      - name: Prepare checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.deb" \) -exec cp {} release-assets/ \;

          expected=(
            "rgfile-${version}-x86_64-unknown-linux-gnu.tar.gz"
            "rgfile-${version}-x86_64-unknown-linux-musl.tar.gz"
            "rgfile-${version}-aarch64-apple-darwin.tar.gz"
            "rgfile-${version}-x86_64-apple-darwin.tar.gz"
            "rgfile-${version}-x86_64-pc-windows-msvc.zip"
            "rgfile_${version}_amd64.deb"
          )
          for asset in "${expected[@]}"; do
            test -f "release-assets/${asset}"
          done

          shopt -s nullglob
          archives=(release-assets/*.tar.gz release-assets/*.zip release-assets/*.deb)
          if [[ "${#archives[@]}" -ne 6 ]]; then
            find release-assets -maxdepth 1 -type f -print
            exit 1
          fi

          (cd release-assets && sha256sum -- *.tar.gz *.zip *.deb > SHA256SUMS)
          (cd release-assets && sha256sum -c SHA256SUMS)

      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          changelog_version="${version%%-*}"
          awk -v version="${changelog_version}" '
            /^## \[/ {
              if (in_section) {
                exit
              }
              if (index($0, "## [" version "]") == 1) {
                in_section = 1
              }
              next
            }
            in_section {
              print
            }
          ' docs/CHANGELOG.md > changelog-excerpt.md

          {
            echo "## ${GITHUB_REF_NAME}"
            echo
            if [[ -s changelog-excerpt.md ]]; then
              cat changelog-excerpt.md
            else
              echo "Release candidate for v${changelog_version}."
            fi
            echo
            echo "### License"
            echo
            echo "This binary release is distributed under the MIT license."
            echo "Each archive includes LICENSE and README.md."
            echo "Source for this release is the repository content at:"
            echo "https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}"
          } > RELEASE_NOTES.md

      - name: Inspect existing GitHub Release
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "state=missing" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          existing_tag="$(gh release view "${GITHUB_REF_NAME}" --json tagName --jq '.tagName')"
          existing_title="$(gh release view "${GITHUB_REF_NAME}" --json name --jq '.name')"
          existing_body="$(gh release view "${GITHUB_REF_NAME}" --json body --jq '.body')"
          existing_draft="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft')"
          existing_prerelease="$(gh release view "${GITHUB_REF_NAME}" --json isPrerelease --jq '.isPrerelease')"
          expected_body="$(< RELEASE_NOTES.md)"
          expected_prerelease=false
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            expected_prerelease=true
          fi

          if [[ "${existing_tag}" != "${GITHUB_REF_NAME}" ]] ||
             [[ "${existing_title}" != "${GITHUB_REF_NAME}" ]] ||
             [[ "${existing_body}" != "${expected_body}" ]] ||
             [[ "${existing_prerelease}" != "${expected_prerelease}" ]]; then
            echo "existing release metadata differs from this immutable build; refusing to edit it" >&2
            exit 1
          fi

          if [[ "${existing_draft}" == "true" ]]; then
            echo "state=draft" >> "${GITHUB_OUTPUT}"
            echo "Existing matching draft will be repaired from this deterministic build."
          else
            echo "state=published" >> "${GITHUB_OUTPUT}"
            echo "Existing published release will only be verified; it is immutable."
          fi

      - name: Stage new GitHub Release as draft
        if: steps.release_state.outputs.state == 'missing'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          create_args=(
            --verify-tag
            --draft
            --title "${GITHUB_REF_NAME}"
            --notes-file RELEASE_NOTES.md
          )
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            create_args+=(--prerelease)
          fi

          gh release create "${GITHUB_REF_NAME}" "${create_args[@]}"
          gh release upload "${GITHUB_REF_NAME}" release-assets/*

      - name: Repair matching draft assets
        if: steps.release_state.outputs.state == 'draft'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Drafts are unpublished staging state. A prior run may have stopped
          # during upload, so refresh only the deterministic expected names.
          # Unexpected names remain in place and make the verification fail
          # closed for manual review.
          gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published-assets
          gh release download "${GITHUB_REF_NAME}" --dir published-assets

          expected_names="$(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)"
          published_names="$(find published-assets -maxdepth 1 -type f -printf '%f\n' | sort)"
          if [[ "${expected_names}" != "${published_names}" ]]; then
            echo "published asset set differs from the build output" >&2
            diff -u <(printf '%s\n' "${expected_names}") <(printf '%s\n' "${published_names}") || true
            exit 1
          fi
          for asset in release-assets/*; do
            test -f "published-assets/$(basename "${asset}")"
          done
          cmp release-assets/SHA256SUMS published-assets/SHA256SUMS
          (cd published-assets && sha256sum -c SHA256SUMS)

      - name: Publish verified release
        if: steps.release_state.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          publish_args=(--draft=false)
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            publish_args+=(--prerelease)
          else
            publish_args+=(--prerelease=false)
          fi
          gh release edit "${GITHUB_REF_NAME}" "${publish_args[@]}"
